[project]
name = "agentguard-mcp"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "mcp==2.3.0",
    "auth0-api-python==1.0.0b10",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "supabase==2.34.0",
]

[tool.poetry]
name = "agentguard-mcp"
version = "0.2.0"
description = "Identity-aware MCP authorization server with Auth0, least-privilege scopes, contextual policy, human approval, replay protection, and Supabase audit logging."
authors = ["AgentGuard"]
readme = "README.md"
package-mode = true
packages = [{ include = "src" }]


[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"
[tool.vercel]
entrypoint = "app:app"
