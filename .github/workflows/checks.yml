name: Backend checks
on: [push, pull_request]
jobs:
  local-ledger-evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: evaluation/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run --silent evaluate
  safety:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.7
      - run: uv lock --check
      - run: uv export --frozen --no-dev --no-emit-project --output-file requirements.txt
      - run: git diff --exit-code -- requirements.txt
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -v
